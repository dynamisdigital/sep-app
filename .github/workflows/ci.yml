# =============================================================================
# CI do repositorio sep-app (frontend Angular).
# Copiado de docs-SEP/docs-sep/ci-pipelines/templates/sep-app-ci.template.yml
# Ajustes locais: name renomeado para CI-APP; adicionados format:check e lint:scss.
# =============================================================================

name: CI-APP

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    # Roda em push de qualquer branch (feature/*, fix/*, hotfix/*, etc.) pra
    # garantir test+build antes de abrir PR. Branches com PR aberto rodarao
    # 2 vezes (push + pull_request); tolerado pela equipe pra validacao
    # continua (alinhado a sep-api/sep-mobile).
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test, Lint, Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint TS/HTML
        run: npm run lint

      - name: Lint SCSS
        run: npm run lint:scss

      - name: Test with coverage
        run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-coverage
          path: coverage/
          retention-days: 14

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: dist/
          retention-days: 14
