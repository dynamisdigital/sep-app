# Configuracao do Dependabot para o sep-app.
# Estrategia: agrupar amplamente para reduzir o numero de PRs, com limite baixo e
# ignore de majors que quebram a stack Angular 20 (CI Node 20, vitest 3 + @analogjs
# 1.x fixados no Angular 20). Ordem dos grupos importa: cada dependencia entra no
# PRIMEIRO grupo cujo pattern casa.
version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    groups:
      # Pacotes Angular sobem em conjunto (sync de versao), SO minor/patch.
      # Majors (ex: Angular 20 -> 22) sao migracao manual via `ng update` e
      # estao no ignore abaixo — Dependabot nao deve propor.
      angular:
        patterns:
          - '@angular/*'
          - '@angular-devkit/*'
          - '@angular-eslint/*'
          - 'angular-eslint'
        update-types:
          - 'minor'
          - 'patch'
      # Stack de teste/bundler: vitest e @vitest/coverage-v8 precisam da MESMA
      # versao; vite/@analogjs acompanham.
      test-tooling:
        patterns:
          - 'vitest'
          - '@vitest/*'
          - 'vite'
          - '@analogjs/*'
        update-types:
          - 'minor'
          - 'patch'
      # Catch-all de baixo risco: tudo que nao for Angular/test-tooling, em UMA
      # PR de minor + patch.
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    # Sem grupo de majors: o Dependabot nao abre PRs de major automaticamente.
    # Os ignore abaixo reforcam por dependencia o que ja era politica.
    ignore:
      # Majors do Angular (20 -> 21/22...) exigem `ng update` + Node 22+ e
      # quebram a stack atual (CI Node 20; @analogjs 1.x + vitest 4 nao entendem
      # o `ngDeclare` do Angular 22). Migracao deliberada, nunca por bump automatico.
      - dependency-name: '@angular/*'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: '@angular-devkit/*'
        update-types:
          - 'version-update:semver-major'
      # angular-eslint 21.4+ apertou o peer para `@angular/cli >= 21` — minors da
      # serie 21.x ja nao instalam com Angular 20. Congelar em 21.0.x ate a major.
      - dependency-name: '@angular-eslint/*'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
      - dependency-name: 'angular-eslint'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
      # Majors de @analogjs/vitest nao sao aplicaveis no Angular 20: @analogjs 2.x
      # exige Angular 21+. Manter na serie atual ate uma futura migracao de Angular.
      - dependency-name: '@analogjs/*'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'vitest'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: '@vitest/*'
        update-types:
          - 'version-update:semver-major'
      # TypeScript 6+ e exigencia do Angular 22 (ADR 0018); Angular 20 trava
      # `>=5.8 <6.0`. Major de TS so na sprint dedicada de migracao.
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
      # zone.js e pre-1.0: minor = breaking. 0.16.x pareia com Angular 21+;
      # Angular 20 core exige ~0.15.0 (peer). Sobe junto com a major do Angular.
      - dependency-name: 'zone.js'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
      # @types/node acompanha o Node da esteira (20 hoje); major junto com o
      # bump de Node 22 planejado para a infra da Fase 5.
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'
      # Majors de tooling de lint sobem deliberadamente, nunca por bump
      # automatico (mesma politica dos demais ignores).
      - dependency-name: 'eslint-config-prettier'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'eslint'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: '@eslint/*'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'stylelint'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'stylelint-config-standard-scss'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'jsdom'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'lint-staged'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'lucide-angular'
        update-types:
          - 'version-update:semver-major'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - '*'
