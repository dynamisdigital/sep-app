<div class="sep-shell" [class.sep-shell-immersive]="immersive()">
  @if (!immersive()) {
    <sep-header (toggleSidenav)="toggleSidenav()" />
  }

  <div class="sep-shell-body">
    @if (!immersive()) {
      <sep-sidenav [collapsed]="sidenavCollapsed()" />
    }

    <main class="sep-shell-main">
      @if (!immersive()) {
        <sep-breadcrumbs />
      }
      <div class="sep-shell-content">
        <router-outlet />
      </div>
    </main>
  </div>
</div>
