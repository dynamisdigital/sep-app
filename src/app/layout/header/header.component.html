<header class="sep-header" role="banner">
  <button
    type="button"
    class="sep-header-toggle"
    aria-label="Alternar menu lateral"
    (click)="onToggle()"
  >
    <lucide-icon name="menu" [size]="20" aria-hidden="true" />
  </button>

  <span class="sep-header-brand">SEP</span>

  <div class="sep-header-spacer"></div>

  <button
    type="button"
    class="sep-header-theme-toggle"
    [attr.aria-label]="isDark() ? 'Ativar tema claro' : 'Ativar tema escuro'"
    [attr.aria-pressed]="isDark()"
    (click)="toggleTheme()"
  >
    @if (isDark()) {
      <lucide-icon name="sun" [size]="18" aria-hidden="true" />
    } @else {
      <lucide-icon name="moon" [size]="18" aria-hidden="true" />
    }
  </button>

  @if (currentUser(); as user) {
    <div class="sep-header-user" aria-label="Usuario autenticado">
      <span class="sep-header-user-name">{{ user.username }}</span>
      <span class="sep-header-user-badge">{{ user.role }}</span>
    </div>
    <button type="button" class="sep-header-logout" (click)="logout()">
      <lucide-icon name="log-out" [size]="16" aria-hidden="true" />
      <span>Sair</span>
    </button>
  }
</header>
