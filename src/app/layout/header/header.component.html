<header class="sep-header" role="banner">
  <button
    type="button"
    class="sep-header-toggle"
    aria-label="Alternar menu lateral"
    (click)="onToggle()"
  >
    <span class="sep-header-toggle-bar"></span>
    <span class="sep-header-toggle-bar"></span>
    <span class="sep-header-toggle-bar"></span>
  </button>

  <span class="sep-header-brand">SEP</span>

  <div class="sep-header-spacer"></div>

  <button
    type="button"
    class="sep-header-theme-toggle"
    [attr.aria-label]="isDark() ? 'Ativar tema claro' : 'Ativar tema escuro'"
    [attr.aria-pressed]="isDark()"
    (click)="toggleTheme()"
  >
    @if (isDark()) {
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        aria-hidden="true"
      >
        <circle cx="12" cy="12" r="4" />
        <path
          d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"
          stroke-linecap="round"
        />
      </svg>
    } @else {
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        aria-hidden="true"
      >
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" stroke-linejoin="round" />
      </svg>
    }
  </button>

  @if (currentUser(); as user) {
    <div class="sep-header-user" aria-label="Usuario autenticado">
      <span class="sep-header-user-name">{{ user.username }}</span>
      <span class="sep-header-user-badge">{{ user.role }}</span>
    </div>
    <button type="button" class="sep-header-logout" (click)="logout()">Sair</button>
  }
</header>
