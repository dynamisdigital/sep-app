<div class="sep-sidenav" [class.sep-sidenav-collapsed]="collapsed">
  <div class="sep-sidenav-brand">
    <span class="sep-sidenav-brand-mark">SEP</span>
  </div>

  <nav class="sep-sidenav-nav" aria-label="Menu lateral">
    @for (group of visibleGroups(); track $index) {
      <div class="sep-sidenav-group">
        @if (group.label) {
          <span class="sep-sidenav-group-label">{{ group.label }}</span>
        }
        <ul class="sep-sidenav-list">
          @for (item of group.items; track item.label) {
            <li class="sep-sidenav-item">
              <a
                [routerLink]="item.route"
                routerLinkActive="sep-sidenav-link-active"
                class="sep-sidenav-link"
              >
                <lucide-icon
                  [name]="item.icon"
                  [size]="18"
                  class="sep-sidenav-icon"
                  aria-hidden="true"
                />
                <span class="sep-sidenav-label">{{ item.label }}</span>
              </a>
            </li>
          }
        </ul>
      </div>
    }
  </nav>

  @if (currentUser(); as user) {
    <footer class="sep-sidenav-footer">
      <span class="sep-sidenav-avatar" aria-hidden="true">{{
        user.username.charAt(0).toUpperCase()
      }}</span>
      <div class="sep-sidenav-user">
        <span class="sep-sidenav-user-name">{{ user.username }}</span>
        <span class="sep-sidenav-user-role">{{ user.role }}</span>
      </div>
    </footer>
  }
</div>
