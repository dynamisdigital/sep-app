<section class="sep-admin-home">
  <header class="sep-admin-home-header">
    <h1 class="sep-admin-home-title">Administração</h1>
    <p class="sep-admin-home-subtitle">Governança de usuários, roles e parâmetros operacionais.</p>
  </header>

  <div class="sep-admin-home-cards">
    @for (card of cards; track card.label) {
      @if (card.disabled) {
        <div class="sep-admin-home-card sep-admin-home-card-disabled" aria-disabled="true">
          <span class="sep-admin-home-card-title">{{ card.label }}</span>
          <span class="sep-admin-home-card-body">{{ card.description }}</span>
          <span class="sep-admin-home-card-soon">Disponível em breve</span>
        </div>
      } @else {
        <a [routerLink]="card.route" class="sep-admin-home-card">
          <span class="sep-admin-home-card-title">{{ card.label }}</span>
          <span class="sep-admin-home-card-body">{{ card.description }}</span>
        </a>
      }
    }
  </div>
</section>
