<section class="sep-cobranca-shell">
  <header class="sep-cobranca-shell-header">
    <h1 class="sep-cobranca-shell-title">Cobranca</h1>
    <p class="sep-cobranca-shell-subtitle">Acompanhe parcelas, recebimentos e renegociacoes.</p>
  </header>

  @if (isOperador()) {
    <div class="sep-cobranca-shell-cards">
      @for (item of placeholdersFinanceiro; track item.label) {
        <article
          class="sep-cobranca-shell-card sep-cobranca-shell-card-disabled"
          aria-disabled="true"
        >
          <span class="sep-cobranca-shell-card-title">{{ item.label }}</span>
          <span class="sep-cobranca-shell-card-body">{{ item.description }}</span>
        </article>
      }
    </div>
  } @else {
    <div class="sep-cobranca-shell-empty">
      <p>Suas parcelas aparecem a partir de um contrato assinado.</p>
      <a routerLink="/app/formalizacao" class="sep-cobranca-shell-link">Ver meus contratos</a>
    </div>
  }
</section>
