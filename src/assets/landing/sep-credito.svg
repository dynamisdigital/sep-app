<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Ilustracao analise de credito">
  <rect width="600" height="400" fill="#f5f5f7"/>
  <g fill="none" stroke="#1d1d1f" stroke-width="1.5">
    <circle cx="180" cy="200" r="60"/>
    <circle cx="300" cy="200" r="60"/>
    <circle cx="420" cy="200" r="60"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-weight="600" text-anchor="middle">
    <text x="180" y="207" font-size="20" fill="#1d1d1f">KYC</text>
    <text x="300" y="207" font-size="20" fill="#1d1d1f">Score</text>
    <text x="420" y="207" font-size="20" fill="#0066cc">Aprovado</text>
  </g>
  <g stroke="#7a7a7a" stroke-width="1.5">
    <line x1="240" y1="200" x2="240" y2="200" marker-end="url(#arrow)"/>
    <line x1="360" y1="200" x2="360" y2="200" marker-end="url(#arrow)"/>
  </g>
  <text x="300" y="350" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="14" fill="#7a7a7a">Esteira de analise auditavel</text>
</svg>
