<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Ilustracao SEP Capital de Giro">
  <defs>
    <linearGradient id="capitalSurface" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fafafc"/>
      <stop offset="1" stop-color="#f0f0f3"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#capitalSurface)"/>
  <g fill="none" stroke="#1d1d1f" stroke-width="1.5">
    <rect x="80" y="120" width="160" height="180" rx="11"/>
    <rect x="260" y="80" width="160" height="220" rx="11"/>
    <rect x="440" y="160" width="80" height="140" rx="11"/>
  </g>
  <g fill="#0066cc" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-weight="600">
    <text x="160" y="220" text-anchor="middle" font-size="28">PJ</text>
    <text x="340" y="200" text-anchor="middle" font-size="34">SEP</text>
    <text x="480" y="240" text-anchor="middle" font-size="22">PJ</text>
  </g>
  <text x="300" y="350" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="14" fill="#7a7a7a">Capital de giro entre empresas</text>
</svg>
